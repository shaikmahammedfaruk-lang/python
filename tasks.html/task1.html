<!DOCTYPE html>
<html>
<head>
    <title>Student ID Card</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .card{
            width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        .header{
            background-color: #0052cc;
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .photo{
            width: 220px;
            height: 220px;
            border: 4px solid black;
            border-radius: 50%;
            margin: 25px auto;
            overflow: hidden;
        }

        .photo img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name{
            color: #0052cc;
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }

        .details{
            font-size: 18px;
            line-height: 1.8;
            padding-bottom: 30px;
        }

        .details b{
            color: black;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        Newtons institute of <br>
        science and technology
    </div>

    <div class="photo">
        <img src="profile.jpg" alt="Student Photo">
    </div>

    <div class="name">Shaik Mahammad Faruk</div>

    <div class="details">
        <b>ID:</b> 239H1A05B0 <br>
        <b>Course:</b> B.Tech CSE <br>
        <b>Year:</b> 4th Year <br>
        <b>Blood Group:</b> B+ <br>
        <b>Phone:</b> 7780199038
    </div>

</div>

</body>
</html>
